services:
  backend:
    image: ghcr.io/themikaelt/anya-backend:latest
    restart: unless-stopped
    environment:
      PORT: 3001
      CONFIG_PATH: /app/config/dashboard.json
      TEMPLATES_PATH: /app/config/templates.json
      BACKUP_PATH: ${ANYA_BACKUP_PATH:-/app/config/backups}
      HEIMDALL_DB_PATH: /app/import/heimdall/app.sqlite
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-110}"
    volumes:
      - ${ANYA_CONFIG_DIR:-./config}:/app/config
      - ${ANYA_BACKUP_HOST_PATH:-./config/backups}:/app/external-backups
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/heimdall/config/www:/app/import/heimdall:ro
    expose:
      - "3001"

  frontend:
    image: ghcr.io/themikaelt/anya-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ANYA_PORT:-8088}:80"
